spring.application.name=fulfillment-service
server.port=8086

# H2 Database (Development)
spring.datasource.url=jdbc:h2:mem:fulfillment
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Logging
logging.level.com.konasl.fulfillment=INFO

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# ===== MEMORY OPTIMIZATION SETTINGS =====
server.undertow.threads.io=4
server.undertow.threads.worker=20
server.undertow.buffer-size=512
server.undertow.direct-buffers=true
server.undertow.max-connections=50

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true

spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=50
spring.task.execution.thread-name-prefix=fulfillment-task-

spring.task.scheduling.pool.size=2
