spring.application.name=user-access-service
server.port=8080

# H2 Database (Development)
spring.datasource.url=jdbc:h2:mem:useraccess
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Logging
logging.level.com.konasl.useraccess=INFO

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# ===== MEMORY OPTIMIZATION SETTINGS =====
# Undertow Server Configuration
server.undertow.threads.io=4
server.undertow.threads.worker=20
server.undertow.buffer-size=512
server.undertow.direct-buffers=true
server.undertow.max-connections=50

# Database Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# JPA/Hibernate Optimization
spring.jpa.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Task Execution Thread Pool
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=50
spring.task.execution.thread-name-prefix=user-access-task-

# Task Scheduling Thread Pool
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=user-access-scheduling-
