/*
 * Root build configuration for the backend monorepo
 * Defines common dependencies, plugins, and configurations for all subprojects
 */

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

// Apply configuration to all subprojects
subprojects {
    apply plugin: 'java'
    
    // Only apply Spring Boot and dependency management to service modules (not to parent 'services' or 'shared' projects)
    if (project.name != 'performance-test' && project.name != 'services' && project.name != 'shared') {
        apply plugin: 'org.springframework.boot'
        apply plugin: 'io.spring.dependency-management'
    }

    group = 'com.konasl'
    version = '0.0.1-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencies {
        // Lombok for reducing boilerplate
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        // Testing dependencies
        if (project.name != 'performance-test') {
            testImplementation 'org.springframework.boot:spring-boot-starter-test'
        }
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    // Configure JVM args for bootRun task - Optimized for low memory
    tasks.matching { it.name == 'bootRun' }.configureEach {
        jvmArgs '-Xms128m', '-Xmx512m',
                '-XX:MaxMetaspaceSize=256m',
                '-XX:ReservedCodeCacheSize=128m',
                '-XX:+UseG1GC',
                '-XX:MaxGCPauseMillis=200',
                '-XX:+UseStringDeduplication'
    }
}
