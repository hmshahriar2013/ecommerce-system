# Gradle Wrapper properties
# This configuration supports BOTH local and remote Gradle distributions
# 
# ACTIVE CONFIGURATION:
# - Uses local Gradle 8.11 distribution for faster builds and offline support
# - Path: D:\E-drive-Software\gradle-8.11
#
# FALLBACK CONFIGURATION (commented out):
# - Global distribution URL for CI/CD pipelines and team members without local distribution
# - Uncomment distributionUrl and comment distributionPath to use remote distribution
#
# To switch between local and remote:
# 1. For local: Use distributionPath (current active config)
# 2. For remote: Comment distributionPath and uncomment distributionUrl

distributionBase=GRADLE_USER_HOME
# For remote distribution (CI/CD), uncomment the line below and comment out distributionPath
# distributionUrl=https\://services.gradle.org/distributions/gradle-8.11-bin.zip
# For local distribution (faster, offline), use the line below
distributionPath=D\:/E-drive-Software/gradle-8.11
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
